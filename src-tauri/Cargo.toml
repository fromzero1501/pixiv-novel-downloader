[package]
name = "collection-library"
version = "1.2.4"
description = "Local collection library"
authors = ["you"]
edition = "2021"

[lib]
name = "collection_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
encoding_rs = "0.8"
open = "5.3"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

# 送系统回收站要调 shell32 的 SHFileOperationW（资源管理器按 Delete 走的就是它）。
# 只加特性、不引新 crate —— windows 0.61.3 本来就在依赖图里。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }
