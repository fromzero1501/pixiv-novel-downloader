[package]
name = "collection-library"
version = "1.2.18"
description = "Local collection library"
authors = ["you"]
edition = "2021"

[lib]
name = "collection_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
encoding_rs = "0.8"
# 封面落盘前重压用（COVER_JPEG_QUALITY）。**只开 jpeg** —— 源就是 Pixiv 的 JPEG，
# 解+重编都用不到别的格式，关掉 png/gif/webp/tiff 能少编一半依赖、也少占 exe 体积。
# 选纯 Rust 的 image 而不是 turbojpeg / mozjpeg（C 绑定），是为了用户零额外安装：
# 静态链进 exe，不产生 DLL、不依赖 libjpeg 和 VC 运行库。
image = { version = "0.25", default-features = false, features = ["jpeg"] }
open = "5.3"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# 正文全文检索要读 EPUB 内页（v1.2.11）。**只开 deflate** —— EPUB 里正文是 deflate 压的、
# 图片多半是 stored，用不到 bzip2 / zstd / aes 那几档；关掉能少编一半依赖。
# 自己手写 zip 解析也能省这个依赖，但 EPUB 是外部生成的，zip64 / data descriptor 这些
# 边角写法都有，成熟库 + 失败时跳过更稳。
zip = { version = "2", default-features = false, features = ["deflate"] }

# 送系统回收站要调 shell32 的 SHFileOperationW（资源管理器按 Delete 走的就是它）。
# 只加特性、不引新 crate —— windows 0.61.3 本来就在依赖图里。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }
